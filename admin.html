<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050609"><link rel="stylesheet" href="styles.css"><title>Gestion — HYBRID WOOD STUDIOS PROJECTION</title><style>body{background:#050609}.admin{max-width:1100px;margin:auto;padding:28px 18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar button,.row button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}.film-edit{background:#10131a;border:1px solid #343a46;border-radius:16px;padding:18px;margin:16px 0}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formgrid label{display:flex;flex-direction:column;gap:6px}.formgrid input,.formgrid textarea{background:#07090d;color:#fff;border:1px solid #3b414d;border-radius:9px;padding:10px}.formgrid textarea{min-height:90px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.login{max-width:420px;margin:80px auto;padding:25px;background:#10131a;border:1px solid #343a46;border-radius:18px}.login input{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;background:#07090d;color:#fff;border:1px solid #3b414d;margin:12px 0}.danger{background:#40151a!important;color:#fff}.save{background:#c89428;color:#080808}.hidden{display:none}@media(max-width:700px){.formgrid{grid-template-columns:1fr}}</style></head><body><header class="header"><div class="top"><div class="brand"><img src="assets/hybridwood_studios.jpeg" alt="HYBRID WOOD"><div><strong>GESTION DU CATALOGUE</strong><small>HYBRID WOOD STUDIOS PROJECTION</small></div></div><nav class="nav"><a href="index.html">← Plateforme</a></nav></div></header><main class="admin"><div id="login" class="login"><h2>🔐 Administration</h2><p class="muted">Entre le mot de passe administrateur.</p><input id="password" type="password" placeholder="Mot de passe"><button class="btn" onclick="login()">Entrer</button><p id="loginMsg" class="error"></p></div><div id="panel" class="hidden"><h1>⚙️ Modifier les données</h1><p class="muted">Ces changements sont enregistrés sur le serveur et seront utilisés par le site et l’application mobile.</p><div class="toolbar"><button class="save" onclick="saveAll()">💾 Enregistrer sur le serveur</button><button onclick="logout()">Déconnexion</button></div><p id="msg" class="success"></p><section id="films"></section></div></main><script>
let token=localStorage.getItem('hws_admin_token'),data=null;
function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};return fetch(path,opt)}
async function login(){const password=document.getElementById('password').value;const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});const j=await r.json();if(!r.ok){document.getElementById('loginMsg').textContent=j.error;return}token=j.token;localStorage.setItem('hws_admin_token',token);showPanel();}
async function showPanel(){const r=await api('/api/admin/catalog');if(!r.ok){localStorage.removeItem('hws_admin_token');token=null;document.getElementById('login').classList.remove('hidden');return}data=await r.json();document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');render();}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){document.getElementById('films').innerHTML=data.films.map((f,i)=>`<div class="film-edit"><h3>🎬 ${i+1}. ${esc(f.title)}</h3><div class="formgrid"><label>ID<input data-i="${i}" data-k="id" value="${esc(f.id)}"></label><label>Titre<input data-i="${i}" data-k="title" value="${esc(f.title)}"></label><label>Sous-titre<input data-i="${i}" data-k="subtitle" value="${esc(f.subtitle)}"></label><label>Type<input data-i="${i}" data-k="type" value="${esc(f.type)}"></label><label>Prix (HTG)<input type="number" data-i="${i}" data-k="price" value="${Number(f.price||0)}"></label><label>Statut<input data-i="${i}" data-k="status" value="${esc(f.status)}"></label><label>Affiche / image<input data-i="${i}" data-k="poster" value="${esc(f.poster)}"></label><label>Lien vidéo<input data-i="${i}" data-k="videoUrl" value="${esc(f.videoUrl||'')}"></label><label style="grid-column:1/-1">Résumé<textarea data-i="${i}" data-k="description">${esc(f.description)}</textarea></label></div></div>`).join('')}
function collect(){document.querySelectorAll('[data-i][data-k]').forEach(el=>{const i=+el.dataset.i,k=el.dataset.k;data.films[i][k]=k==='price'?Number(el.value):el.value})}
async function saveAll(){collect();const r=await api('/api/admin/catalog',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();document.getElementById('msg').textContent=r.ok?'✓ Données enregistrées sur le serveur.':('Erreur: '+j.error);}
function logout(){localStorage.removeItem('hws_admin_token');location.reload()}
if(token)showPanel();
</script></body></html>
